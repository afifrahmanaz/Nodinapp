<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Nodin Widget</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="widget" id="widget">
    <!-- Title Bar -->
    <div class="title-bar" id="titleBar">
      <div class="title-bar-left">
        <img class="title-icon" src="public/Logo Ditjen Imigrasi .png"
          style="width: 18px; height: 18px; object-fit: contain; margin-right: 2px;" alt="Logo Imigrasi">
        <span class="title-text">Nodin · Lantaskim</span>
      </div>
      <div class="title-bar-right">

        <button class="title-btn" id="btnSettings" title="Pengaturan"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
        <button class="title-btn" id="btnMinimize"><svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M2 5h6" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
          </svg></button>
        <button class="title-btn close-btn" id="btnClose"><svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
          </svg></button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tabInput">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" />
        </svg>
        Buat Baru
      </button>
      <button class="tab-btn" id="tabHistory">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 6v6l4 2" stroke-linecap="round" />
        </svg>
        Riwayat
      </button>
    </div>

    <!-- Input Tab -->
    <div class="tab-content active" id="contentInput">
      <div id="formView">
        <div class="form-row">
          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="tanggalNodin" class="fc">
          </div>
          <div class="form-group">
            <label>Jenis</label>
            <select id="jenisSurat" class="fc">
              <option value="" disabled selected>Pilih...</option>
              <option value="Nodin/BA">Nodin/BA</option>
              <option value="LK">Laporan Kejadian</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Ringkasan</label>
          <textarea id="isiRingkasan" class="fc" rows="3" placeholder="Isi ringkasan surat..."></textarea>
        </div>
        <div class="form-group">
          <label>Pengelola</label>
          <input type="text" id="pengelola" class="fc" placeholder="Nama pengelola...">
        </div>
        <button class="btn-generate" id="btnSubmit" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Generate & Simpan
        </button>
      </div>

      <!-- Result -->
      <div id="resultView" class="result-view" style="display:none;">
        <div class="result-card">
          <div class="result-success">
            <div class="result-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="result-success-text">
              <div class="result-title" id="resultTypeText">Berhasil disimpan</div>
              <div class="result-sub" id="resultMeta"></div>
            </div>
          </div>
          <div class="result-nomor-label">NOMOR SURAT</div>
          <div class="result-nomor-box">
            <span class="result-nomor" id="resultNumber"></span>
            <button class="btn-copy" id="btnCopy">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              <span id="copyText">Salin</span>
            </button>
          </div>
        </div>
        <button class="btn-new" id="btnNewEntry">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14" stroke-linecap="round" />
          </svg>
          Buat Surat Baru
        </button>
      </div>
    <!-- Floating Edit Button -->
    <button id="btnEditManual" class="btn-floating-edit" title="Buka Spreadsheet di Browser">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      Edit Manual
    </button>
    </div>

    <!-- History Tab -->
    <div class="tab-content" id="contentHistory">
      <div class="search-box">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" stroke-linecap="round" />
        </svg>
        <input type="text" id="searchHistory" placeholder="Cari...">
      </div>
      <div class="history-stats">
        <span class="badge blue clickable" id="filterNodin">Nodin <strong id="statNodin">0</strong></span>
        <span class="badge orange clickable" id="filterLK">LK <strong id="statLK">0</strong></span>
        <span class="badge gray clickable" id="filterAll">Total <strong id="statTotal">0</strong></span>
      </div>
      <div class="history-list" id="historyList">
        <div class="loading">
          <div class="spinner"></div><span>Memuat...</span>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">Pengaturan Link Drive</span>
          <button class="title-btn close-modal" id="btnCloseSettings"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></button>
        </div>
        <div class="modal-body">
          <div class="form-group" style="margin-bottom: 8px;">
            <label>Tahun Aktif</label>
            <select id="settingYear" class="fc" style="font-size: 11px;"></select>
          </div>
          
          <div style="margin-bottom: 8px;">
            <button id="btnToggleAdvanced" style="background:none;border:none;color:var(--accent);font-size:10px;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;outline:none;">
              Pengaturan Lanjutan (ID)
              <svg id="iconToggleAdv" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition: transform 0.2s;"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>

          <div class="form-group" id="advancedSettings" style="margin-bottom: 8px; display: none;">
            <label>Spreadsheet ID / Link URL</label>
            <input type="text" id="settingSpreadsheetId" class="fc" style="font-size: 10px;" placeholder="https://docs.google.com/spreadsheets/d/... atau ID">
          </div>
          <button class="btn-generate" id="btnSaveSettings" style="margin-top: 10px;">Simpan Pengaturan</button>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Menghubungkan...</span>
      <span id="activeYearDisplay" style="margin-left: auto; font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.2px;"></span>
    </div>
  </div>
  <script src="renderer.js"></script>
  </body>
</html>
